name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Secrets are exposed via job-level env so the `if:` guards below actually
    # work — the `secrets` context is NOT available in a step-level `if:`, which
    # silently skipped every publish step in the previous version.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify the tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npx @vscode/vsce package --no-dependencies

      # Create the release (with the VSIX) BEFORE publishing, so a transient
      # registry outage never blocks it. Idempotent: re-runs re-upload the asset.
      - name: Create GitHub Release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for details." \
            || gh release upload "$GITHUB_REF_NAME" *.vsix --clobber

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          for attempt in 1 2 3; do
            npx ovsx publish *.vsix -p "$OVSX_PAT" && exit 0
            echo "Open VSX publish attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "::error::Open VSX publish failed after 3 attempts (often a transient 503). Re-run this job when the registry is back."
          exit 1
